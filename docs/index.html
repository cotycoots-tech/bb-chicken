<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="application-name" content="bbc-laugh">
  <meta name="description" content="bbc-laugh — big belly chicken vs big black cat">
  <meta property="og:title" content="bbc-laugh">
  <meta property="og:site_name" content="bbc-laugh">
  <meta property="og:description" content="big belly chicken vs big black cat">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cotycoots-tech.github.io/bb-chicken/">
  <link rel="canonical" href="https://cotycoots-tech.github.io/bb-chicken/">
  <title>bbc-laugh</title>
  <style>
    :root {
      color-scheme: light;
      color: #111;
      background: #f8f4ef;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(0.5rem, var(--safe-top))
        max(0.5rem, var(--safe-right))
        max(0.5rem, var(--safe-bottom))
        max(0.5rem, var(--safe-left));
    }
    .card {
      width: min(100%, 720px);
      max-height: 100%;
      min-height: 0;
      background: linear-gradient(180deg, #ffffff 0%, #fcf7f1 100%);
      border: 1px solid rgba(17, 17, 17, 0.08);
      border-radius: 20px;
      padding: 0.9rem 1rem 0.85rem;
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      overflow: hidden;
    }
    .card--media {
      height: 100%;
      align-self: stretch;
    }
    .card-header { flex: 0 0 auto; }
    .label {
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6c5e53;
      margin-bottom: 0.15rem;
    }
    .value {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      line-height: 1.05;
      color: #1d1b19;
      word-break: break-word;
    }
    .message {
      margin: 0;
      color: #5b5248;
      font-size: 0.95rem;
      line-height: 1.5;
      flex: 0 0 auto;
    }
    .media-frame {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: #111;
      overflow: hidden;
    }
    .media {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background: #000;
    }
    .card:not(.card--media) .media-frame { display: none; }
    .card--media .message { display: none; }
    .actions { display: grid; gap: 0.5rem; flex: 0 0 auto; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.1rem;
      width: 100%;
      border: none;
      border-radius: 999px;
      background: #2f7c47;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .button:hover,
    .button:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 18px 30px rgba(47, 124, 71, 0.24);
      outline: none;
    }
    .footer {
      margin: 0;
      color: #827970;
      font-size: 0.85rem;
      text-align: center;
      flex: 0 0 auto;
    }
    @media (max-height: 700px) {
      .card { padding: 0.65rem 0.75rem; gap: 0.5rem; border-radius: 16px; }
      .button { padding: 0.7rem 1rem; }
      .label { font-size: 0.72rem; }
    }
  </style>
</head>
<body>
  <main id="card" class="card" role="main">
    <div class="card-header">
      <div class="label" id="label"></div>
      <h1 class="value" id="value" hidden></h1>
    </div>
    <div class="media-frame" id="media-frame" hidden></div>
    <p class="message" id="message"></p>
    <div class="actions">
      <button type="button" class="button" id="next-btn">Next</button>
    </div>
    <p class="footer" id="footer"></p>
  </main>
  <script>
    const SITE_NAME = "bbc-laugh";
    // Use github.io until bbc-laugh.com is registered and DNS points at Pages.
    const SITE_DOMAIN = "cotycoots-tech.github.io/bb-chicken";

    const items = [
      { label: "Title", value: SITE_NAME },
      { label: "Domain", value: SITE_DOMAIN },
      { label: "Version", value: "0.1.0" },
      { label: "Author", value: "cotycoots-tech" },
      { label: "Story", value: "big belly chicken vs big black cat" },
      {
        label: "Belly Busting Chicken",
        value: "https://github.com/user-attachments/assets/9965d439-0e58-489c-b3b5-9d41f924c0e5",
        mediaType: "image",
      },
      {
        label: "Belly Busting Chicken (video)",
        value: "https://github.com/user-attachments/assets/805e5236-a004-4572-ad29-5e91558eca3b",
        mediaType: "video",
      },
      {
        label: "Training — Big Black Cat",
        value: "https://github.com/user-attachments/assets/d31d2edf-8238-440e-b658-b7a1f6563d66",
        mediaType: "image",
      },
      {
        label: "Training — Big Black Cat (video)",
        value: "https://github.com/user-attachments/assets/1e5902c6-4a94-4543-a2cb-e1d9e2b9af42",
        mediaType: "video",
      },
      {
        label: "Boxing Chicken vs Black Cat",
        value: "https://github.com/user-attachments/assets/73c75b27-cd64-461b-9ee7-1cf879c0ef82",
        mediaType: "image",
      },
      {
        label: "Boxing Chicken vs Black Cat (video)",
        value: "https://github.com/user-attachments/assets/1b37c9b1-8d7b-46af-864c-520e5cd26a34",
        mediaType: "video",
      },
      {
        label: "Showdown (video)",
        value: "https://github.com/user-attachments/assets/ed79628c-8a78-4273-ae61-f2f47b5b1bce",
        mediaType: "video",
      },
      {
        label: "Finale (video)",
        value: "https://github.com/user-attachments/assets/83801bd3-82e3-48ab-8a42-a94e4475199b",
        mediaType: "video",
      },
      {
        label: "Big Bucket Chicken",
        value: "https://github.com/user-attachments/assets/ded7ac9b-5b20-4258-9060-95d0e8b4837e",
        mediaType: "image",
      },
    ];

    const card = document.getElementById("card");
    const labelEl = document.getElementById("label");
    const valueEl = document.getElementById("value");
    const mediaFrame = document.getElementById("media-frame");
    const messageEl = document.getElementById("message");
    const nextBtn = document.getElementById("next-btn");
    const footerEl = document.getElementById("footer");

    function readIndex() {
      const params = new URLSearchParams(window.location.search);
      const raw = parseInt(params.get("index") || "0", 10);
      return Number.isFinite(raw) && raw >= 0 ? raw : 0;
    }

    function setIndex(index) {
      const url = new URL(window.location.href);
      url.searchParams.set("index", String(index));
      window.history.replaceState({}, "", url);
      render(index);
    }

    function render(index) {
      const total = items.length;
      mediaFrame.innerHTML = "";
      mediaFrame.hidden = true;
      valueEl.hidden = true;
      messageEl.hidden = false;
      card.classList.remove("card--media");

      if (index >= total) {
        labelEl.textContent = "Complete";
        valueEl.hidden = false;
        valueEl.textContent = "That’s the end of " + SITE_NAME;
        messageEl.textContent =
          "You’re at the end of the gallery on " + SITE_DOMAIN + ". Tap to begin again.";
        nextBtn.textContent = "Start over";
        nextBtn.onclick = () => setIndex(0);
        footerEl.textContent =
          "Step " + total + " of " + total + " · " + SITE_NAME + " · " + SITE_DOMAIN;
        return;
      }

      const item = items[index];
      const isMedia = item.mediaType === "image" || item.mediaType === "video";
      labelEl.textContent = item.label;
      nextBtn.textContent = "Next";
      nextBtn.onclick = () => setIndex(index + 1);
      footerEl.textContent =
        "Step " + (index + 1) + " of " + total + " · " + SITE_NAME + " · " + SITE_DOMAIN;

      if (isMedia) {
        card.classList.add("card--media");
        messageEl.hidden = true;
        mediaFrame.hidden = false;
        if (item.mediaType === "image") {
          const img = document.createElement("img");
          img.className = "media";
          img.src = item.value;
          img.alt = item.label;
          img.loading = "lazy";
          mediaFrame.appendChild(img);
        } else {
          const video = document.createElement("video");
          video.className = "media";
          video.controls = true;
          video.autoplay = true;
          video.muted = true;
          video.loop = true;
          video.playsInline = true;
          const source = document.createElement("source");
          source.src = item.value;
          source.type = "video/mp4";
          video.appendChild(source);
          mediaFrame.appendChild(video);
        }
      } else {
        valueEl.hidden = false;
        valueEl.textContent = item.value;
        messageEl.textContent = "Tap the button to move to the next entry.";
      }
    }

    render(readIndex());
  </script>
</body>
</html>
